<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cocokaruボード　あしすと | COCOKARU-LAB.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg: #f7f3ee;
    --bg2: #eee8df;
    --surface: #fffdf9;
    --surface2: #f5f0e8;
    --border: #ddd5c8;
    --text: #3a2e26;
    --text2: #7a6a5a;
    --text3: #b0a090;
    --accent: #c9856a;
    --accent2: #e8a88e;
    --soft-pink: #f6d5cc;
    --soft-blue: #b8d4d8;
    --soft-green: #c2dcc4;
    --soft-yellow: #f3e0a8;
    --heavy: #b08a9e;
    --normal: #a8a890;
    --light: #8ab89a;
    --shadow: 0 2px 12px rgba(80,50,20,0.08);
    --shadow-deep: 0 4px 24px rgba(80,50,20,0.14);
    --radius: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── ヘッダー ── */
  header {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 12px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(80,50,20,0.06);
  }
  .logo {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .logo span {
    font-size: 10px;
    color: var(--text3);
    display: block;
    font-weight: 400;
    letter-spacing: 0.1em;
  }
  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    font-size: 18px;
    color: var(--text2);
    transition: background 0.15s;
  }
  .btn-icon:hover { background: var(--bg2); }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 14px 100px;
  }

  /* ── カード共通 ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-pad { padding: 16px; }

  .section-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
  }

  /* ── タスク入力 ── */
  .intro {
    text-align: center;
    padding: 8px 0 14px;
  }
  .intro-emoji { font-size: 38px; display: block; margin-bottom: 6px; }
  .intro-text {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
  }
  .intro-sub {
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }

  .task-add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .task-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    background: white;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .task-input:focus { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 14px;
    font-family: 'Zen Maru Gothic', sans-serif;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:active { transform: scale(0.97); }

  /* ── 気の重さ選択 ── */
  .mood-select {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .mood-btn {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: white;
    padding: 10px 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .mood-btn:hover { transform: translateY(-2px); }
  .mood-btn .mood-emoji { font-size: 26px; display: block; }
  .mood-btn .mood-label { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .mood-btn.sel-heavy  { border-color: var(--heavy);  background: #f7eef2; }
  .mood-btn.sel-normal { border-color: var(--normal); background: #f4f4ee; }
  .mood-btn.sel-light  { border-color: var(--light);  background: #eef6f0; }

  /* ── タスクカード ── */
  .task-card {
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
    border-left: 5px solid var(--border);
    animation: cardIn 0.25s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .task-card.heavy  { border-left-color: var(--heavy); }
  .task-card.normal { border-left-color: var(--normal); }
  .task-card.light  { border-left-color: var(--light); }

  .task-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .task-card-emoji { font-size: 24px; flex-shrink: 0; }
  .task-card-body { flex: 1; min-width: 0; }
  .task-card-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    color: var(--text);
    word-break: break-word;
  }
  .task-card-status {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }
  .task-card-del {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    color: var(--text3);
    padding: 4px;
    flex-shrink: 0;
  }
  .task-card-del:hover { color: var(--accent); }

  /* ── 展開エリア ── */
  .assist-area {
    border-top: 1px solid var(--border);
    padding: 16px;
    background: var(--surface2);
    display: none;
  }
  .assist-area.open { display: block; animation: cardIn 0.2s ease; }

  /* ステップ進行 */
  .step-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .step-tab {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    padding-bottom: 6px;
    border-bottom: 2.5px solid var(--border);
    transition: all 0.2s;
  }
  .step-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .step-tab.done { color: var(--light); border-bottom-color: var(--light); }

  .assist-q {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .assist-hint {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .assist-textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    background: white;
    color: var(--text);
    outline: none;
    resize: vertical;
    min-height: 70px;
    line-height: 1.6;
  }
  .assist-textarea:focus { border-color: var(--accent); }

  .assist-nav {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: space-between;
  }
  .btn-ghost {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text2);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .btn-ghost:hover { background: var(--border); }

  /* ── 小分け（ゲージ／ステップ） ── */
  .break-type-select {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .break-type-btn {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: white;
    padding: 12px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .break-type-btn:hover { transform: translateY(-2px); }
  .break-type-btn.selected { border-color: var(--accent); background: #fff3ee; }
  .break-type-btn .bt-emoji { font-size: 24px; display: block; }
  .break-type-btn .bt-label { font-size: 12px; color: var(--text); margin-top: 4px; font-weight: 500; }
  .break-type-btn .bt-desc { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* ゲージ設定 */
  .gauge-setup {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .gauge-input {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 14px;
    width: 80px;
    text-align: center;
    background: white;
    color: var(--text);
    outline: none;
  }
  .gauge-input:focus { border-color: var(--accent); }
  .gauge-unit-select {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-size: 14px;
    background: white;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  /* ゲージ表示 */
  .gauge-display { margin: 12px 0; }
  .gauge-bar-wrap {
    background: var(--bg2);
    border-radius: 100px;
    height: 26px;
    overflow: hidden;
    position: relative;
  }
  .gauge-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--soft-green), var(--light));
    border-radius: 100px;
    transition: width 0.5s cubic-bezier(.34,1.4,.64,1);
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .gauge-label {
    text-align: center;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    color: var(--text);
    margin-top: 8px;
  }
  .gauge-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .gauge-add-label {
    text-align: center;
    font-size: 12px;
    color: var(--text2);
    margin-top: 14px;
  }
  .gauge-field-label {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
  }
  .step-hero {
    background: linear-gradient(135deg, #fff3ee, #fdf4f1);
    border: 2px solid var(--accent2);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    margin: 10px 0 14px;
  }
  .step-hero-emoji { font-size: 32px; display: block; margin-bottom: 8px; }
  .step-hero-text {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 17px;
    color: var(--text);
    line-height: 1.5;
  }
  .step-item.step-rest { opacity: 0.7; }
  .step-move {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }
  .step-move-btn {
    background: var(--bg2);
    border: none;
    border-radius: 4px;
    width: 24px;
    height: 18px;
    font-size: 9px;
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s;
  }
  .step-move-btn:hover:not(:disabled) { background: var(--accent2); color: white; }
  .step-move-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── タイマー ── */
  .timer-display { text-align: center; margin: 8px 0; }
  .timer-ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin: 0 auto 6px;
  }
  .timer-ring { transform: rotate(-90deg); }
  .timer-ring-bg { fill: none; stroke: var(--bg2); stroke-width: 12; }
  .timer-ring-fg {
    fill: none;
    stroke: var(--light);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .timer-time {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
  }
  .timer-total-label {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 10px;
  }
  .timer-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .timer-btn {
    border: none;
    border-radius: 100px;
    padding: 11px 22px;
    font-size: 14px;
    font-family: 'Zen Maru Gothic', sans-serif;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }
  .timer-btn:active { transform: scale(0.96); }
  .timer-btn.start { background: var(--light); color: white; }
  .timer-btn.start:hover { background: var(--soft-green); }
  .timer-btn.pause { background: var(--soft-yellow); color: var(--text); }
  .timer-btn.reset { background: var(--bg2); color: var(--text2); }
  .timer-sound-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    user-select: none;
    background: var(--bg2);
    border-radius: 100px;
    padding: 6px 14px;
    border: 1.5px solid var(--border);
  }
  .timer-done-msg {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 17px;
    color: var(--accent);
    margin: 10px 0;
    animation: bounce 0.8s ease infinite alternate;
  }
  .gauge-step-btn {
    background: var(--soft-green);
    border: none;
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Zen Maru Gothic', sans-serif;
    transition: transform 0.1s, background 0.15s;
  }
  .gauge-step-btn:hover { background: var(--light); transform: scale(1.04); }
  .gauge-step-btn:active { transform: scale(0.96); }
  .gauge-step-btn.minus { background: var(--bg2); }

  /* ステップ（つぶつぶ） */
  .step-add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .step-list { display: flex; flex-direction: column; gap: 8px; }
  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: white;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }
  .step-item:hover { border-color: var(--accent2); }
  .step-item.done { background: #eef6f0; border-color: var(--soft-green); }
  .step-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: all 0.2s;
  }
  .step-item.done .step-dot {
    background: var(--soft-green);
    border-color: var(--light);
    animation: pop 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { 0%{transform:scale(0.6);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }
  .step-text { flex: 1; font-size: 14px; color: var(--text); }
  .step-item.done .step-text { color: var(--text2); }
  .step-del {
    background: none; border: none; cursor: pointer;
    font-size: 13px; color: var(--text3); padding: 2px;
  }
  .step-del:hover { color: var(--accent); }

  /* ── ほめる ── */
  .praise-area { text-align: center; }
  .praise-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 17px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .praise-sub { font-size: 12px; color: var(--text3); margin-bottom: 16px; }
  .praise-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .praise-btn {
    border: 2px solid var(--soft-pink);
    background: #fdf4f1;
    border-radius: 100px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Zen Maru Gothic', sans-serif;
    transition: all 0.15s;
  }
  .praise-btn:hover { background: var(--soft-pink); transform: scale(1.02); }
  .praise-custom {
    width: 100%;
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    background: white;
    color: var(--text);
    outline: none;
    text-align: center;
  }
  .praise-custom:focus { border-color: var(--accent); border-style: solid; }

  /* 完了画面 */
  .celebrate {
    text-align: center;
    padding: 20px 10px;
  }
  .celebrate-emoji { font-size: 50px; display: block; margin-bottom: 10px; animation: bounce 0.8s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0);} to{transform:translateY(-8px);} }
  .celebrate-msg {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 18px;
    color: var(--accent);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .celebrate-praise {
    font-size: 15px;
    color: var(--text);
    background: #fdf4f1;
    border-radius: var(--radius-sm);
    padding: 12px;
    margin: 14px 0;
    line-height: 1.6;
  }

  .empty-msg {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 20px 0;
    line-height: 1.7;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 0 8px;
    text-align: center;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
  }

  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    opacity: 0;
    max-width: 90vw;
    text-align: center;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── 休む提案 ── */
  .rest-suggest { text-align: center; padding: 6px 0; }
  .rest-emoji { font-size: 42px; display: block; margin-bottom: 10px; }
  .rest-msg {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .rest-sub {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
    margin-bottom: 18px;
  }
  .rest-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── 動けそう？分岐 ── */
  .ready-check { text-align: center; }
  .ready-q {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .ready-options { display: flex; flex-direction: column; gap: 8px; }
  .ready-btn {
    border: 2px solid var(--border);
    background: white;
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Zen Maru Gothic', sans-serif;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ready-btn:hover { transform: translateY(-2px); }
  .ready-btn .rb-emoji { font-size: 22px; flex-shrink: 0; }
  .ready-btn.go { border-color: var(--light); background: #eef6f0; }
  .ready-btn.smaller { border-color: var(--accent2); }
  .ready-btn.rethink { border-color: var(--soft-blue); }
  .ready-btn.stop { border-color: var(--heavy); background: #f7eef2; }
  .ready-btn .rb-text { line-height: 1.4; }
  .ready-btn .rb-sub { font-size: 11px; color: var(--text3); font-weight: 400; }

  /* 休み中バッジ */
  .resting-badge {
    display: inline-block;
    font-size: 11px;
    background: var(--soft-blue);
    color: var(--text);
    border-radius: 100px;
    padding: 2px 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    cocokaruボード　あしすと
    <span>COCOKARU-LAB.</span>
  </div>
</header>

<main id="main-content"></main>

<footer>© COCOKARU-LAB. All rights reserved.</footer>
<div class="toast" id="toast"></div>

<script>
// ──────────────────────────────────────────────
const STORAGE_KEY = 'cocokarubord-assist-v1';

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function defaultState() {
  return { tasks: [] };
}

// 各タスク: { id, text, mood:'heavy'|'normal'|'light', open:bool, step:0-3,
//   think:{ heavy:'', smaller:'', help:'', tiny:'' },
//   breakType:null|'gauge'|'steps',
//   gauge:{ total, current, unit }, steps:[{id,text,done}],
//   praise:'', done:bool }

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed.tasks) parsed.tasks = [];
    return parsed;
  } catch(e) {
    console.error('loadState error:', e);
    return defaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    console.error('saveState error:', e);
  }
}

// 誉め言葉の候補
const PRAISE_WORDS = [
  'えらい！よくやった👏',
  'はじめの一歩がすごい🌱',
  'ちゃんと向き合えたね😊',
  '今日のわたし、がんばった⭐',
  '一歩進めた自分にはなまる💮'
];

const MOOD = {
  heavy:  { emoji: '😩', label: '気が重い' },
  normal: { emoji: '😐', label: '普通' },
  light:  { emoji: '😊', label: '気軽' }
};

const ENERGY = {
  good:  { emoji: '🔋', label: '元気' },
  ok:    { emoji: '🔌', label: 'ふつう' },
  tired: { emoji: '🪫', label: '疲れてる' }
};

const THINK_STEPS = [
  { key: 'heavy',   q: '何がそんなに気が重いですか？',           hint: '心に浮かんだことを、そのまま書いてみましょう。' },
  { key: 'reward',  q: 'これができたら、その先にどんないいことが待っていますか？', hint: 'どんな気持ちの自分がいる？ ほっとする？ すっきりする？ 自分へのご褒美を考えるのもいいですね🎁' },
  { key: 'block',   q: '取り掛かる前に何か引っかかっていることはありますか？', hint: '例：道具がどこにあるか分からない、場所が片付いていない…。小さな引っかかりも書いてみましょう。' },
  { key: 'tiny',    q: 'ほんの少しだけやるとしたら、何からはじめる？',     hint: '例：とりあえず本を机に出す、パソコンの電源を入れる、メールを1通開くだけ、5分だけやってみる…。ばかばかしいほど小さくてOKです。' },
  { key: 'help',    q: '誰かに頼れそうですか？',             hint: '少しだけでも。お願いできそうな人はいますか？（なければ空欄でOK）' }
];

// ──────────────────────────────────────────────
function render() {
  const main = document.getElementById('main-content');
  main.innerHTML = '';

  // 入力カード
  main.appendChild(renderInput());

  // タスク一覧
  if (state.tasks.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'card card-pad';
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.innerHTML = '気になっていること、<br>気が重いことを書いてみましょう。<br>いっしょに少しずつ整理します🌱';
    empty.appendChild(msg);
    main.appendChild(empty);
  } else {
    state.tasks.forEach(t => main.appendChild(renderTaskCard(t)));
  }
}

function renderInput() {
  const card = document.createElement('div');
  card.className = 'card card-pad';

  const intro = document.createElement('div');
  intro.className = 'intro';
  intro.innerHTML = `
    <span class="intro-emoji">🍵</span>
    <div class="intro-text">どんなことが気になっていますか？</div>
    <div class="intro-sub">ひとつずつ、いっしょに整理しましょう</div>
  `;
  card.appendChild(intro);

  const form = document.createElement('div');
  form.className = 'task-add-form';
  const input = document.createElement('input');
  input.className = 'task-input';
  input.id = 'task-input';
  input.placeholder = '例：確定申告、部屋の片付け…';
  input.onkeydown = (e) => { if (e.key === 'Enter') addTask(); };
  const btn = document.createElement('button');
  btn.className = 'btn-primary';
  btn.textContent = '＋';
  btn.onclick = () => addTask();
  form.appendChild(input);
  form.appendChild(btn);
  card.appendChild(form);

  return card;
}

function renderTaskCard(t) {
  const card = document.createElement('div');
  card.className = 'task-card ' + t.mood;

  // ヘッド
  const head = document.createElement('div');
  head.className = 'task-card-head';
  head.onclick = () => {
    t.open = !t.open;
    if (t.open && t.resting) t.resting = false;  // 再開したら休み中を解除
    saveState();
    render();
  };

  const emoji = document.createElement('span');
  emoji.className = 'task-card-emoji';
  emoji.textContent = MOOD[t.mood].emoji;
  head.appendChild(emoji);

  const body = document.createElement('div');
  body.className = 'task-card-body';
  const title = document.createElement('div');
  title.className = 'task-card-title';
  title.textContent = t.text;
  body.appendChild(title);
  const status = document.createElement('div');
  status.className = 'task-card-status';
  if (t.done) {
    status.textContent = '🎉 やりきりました！';
  } else if (t.resting) {
    status.innerHTML = '<span class="resting-badge">🌙 おやすみ中</span> タップで再開';
  } else {
    status.textContent = t.open ? 'タップで閉じる' : 'タップで整理をはじめる';
  }
  body.appendChild(status);
  head.appendChild(body);

  const del = document.createElement('button');
  del.className = 'task-card-del';
  del.innerHTML = '🗑️';
  del.onclick = (e) => { e.stopPropagation(); deleteTask(t.id); };
  head.appendChild(del);

  card.appendChild(head);

  // 展開エリア
  if (t.open) {
    const area = document.createElement('div');
    area.className = 'assist-area open';
    if (t.done) {
      area.appendChild(renderCelebrate(t));
    } else {
      area.appendChild(renderAssist(t));
    }
    card.appendChild(area);
  }

  return card;
}

// 思考整理 → 小分け → ほめる の3ステップ
function renderAssist(t) {
  const wrap = document.createElement('div');

  // ステップタブ
  const tabs = document.createElement('div');
  tabs.className = 'step-tabs';
  ['整理する', '小分けにする', '動けそう？', 'できた！'].forEach((label, i) => {
    const tab = document.createElement('div');
    tab.className = 'step-tab' + (i === t.step ? ' active' : i < t.step ? ' done' : '');
    tab.textContent = label;
    tabs.appendChild(tab);
  });
  wrap.appendChild(tabs);

  if (t.step === 0) wrap.appendChild(renderThinkStep(t));
  else if (t.step === 1) wrap.appendChild(renderBreakStep(t));
  else if (t.step === 2) wrap.appendChild(renderReadyStep(t));
  else if (t.step === 3) wrap.appendChild(renderPraiseStep(t));

  return wrap;
}

// ステップ0：思考整理
function renderThinkStep(t) {
  const wrap = document.createElement('div');

  THINK_STEPS.forEach(s => {
    const q = document.createElement('div');
    q.className = 'assist-q';
    q.textContent = s.q;
    wrap.appendChild(q);
    const hint = document.createElement('div');
    hint.className = 'assist-hint';
    hint.textContent = s.hint;
    wrap.appendChild(hint);
    const ta = document.createElement('textarea');
    ta.className = 'assist-textarea';
    ta.style.marginBottom = '14px';
    ta.value = t.think[s.key] || '';
    ta.placeholder = 'ここに書いてみましょう…';
    ta.oninput = () => { t.think[s.key] = ta.value; saveState(); };
    wrap.appendChild(ta);
  });

  const nav = document.createElement('div');
  nav.className = 'assist-nav';
  const spacer = document.createElement('span');
  const next = document.createElement('button');
  next.className = 'btn-primary';
  next.textContent = '小分けにする →';
  next.onclick = () => { t.step = 1; saveState(); render(); };
  nav.appendChild(spacer);
  nav.appendChild(next);
  wrap.appendChild(nav);

  return wrap;
}

// ステップ1：小分け
function renderBreakStep(t) {
  const wrap = document.createElement('div');

  if (!t.breakType) {
    const q = document.createElement('div');
    q.className = 'assist-q';
    q.textContent = 'どんなふうに進めますか？';
    wrap.appendChild(q);
    const hint = document.createElement('div');
    hint.className = 'assist-hint';
    hint.textContent = 'やりやすい方を選んでください。あとで変えられます。';
    wrap.appendChild(hint);

    const sel = document.createElement('div');
    sel.className = 'break-type-select';
    const gaugeBtn = document.createElement('div');
    gaugeBtn.className = 'break-type-btn';
    gaugeBtn.innerHTML = `<span class="bt-emoji">📊</span><div class="bt-label">少しずつゲージ</div><div class="bt-desc">時間・ページ・回数で</div>`;
    gaugeBtn.onclick = () => { t.breakType = 'gauge'; saveState(); render(); };
    const stepsBtn = document.createElement('div');
    stepsBtn.className = 'break-type-btn';
    stepsBtn.innerHTML = `<span class="bt-emoji">🌸</span><div class="bt-label">手順を灯す</div><div class="bt-desc">小さな手順に分けて</div>`;
    stepsBtn.onclick = () => { t.breakType = 'steps'; saveState(); render(); };
    sel.appendChild(gaugeBtn);
    sel.appendChild(stepsBtn);
    wrap.appendChild(sel);

    const nav = document.createElement('div');
    nav.className = 'assist-nav';
    const back = document.createElement('button');
    back.className = 'btn-ghost';
    back.textContent = '← もどる';
    back.onclick = () => { t.step = 0; saveState(); render(); };
    nav.appendChild(back);
    wrap.appendChild(nav);
    return wrap;
  }

  if (t.breakType === 'gauge') wrap.appendChild(renderGauge(t));
  else wrap.appendChild(renderSteps(t));

  // ナビ
  const nav = document.createElement('div');
  nav.className = 'assist-nav';
  const back = document.createElement('button');
  back.className = 'btn-ghost';
  back.textContent = '← 進め方を変える';
  back.onclick = () => {
    t.breakType = null;
    t.gauge = null;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    saveState();
    render();
  };
  const next = document.createElement('button');
  next.className = 'btn-primary';
  next.textContent = '次へ →';
  next.onclick = () => { t.step = 2; saveState(); render(); };
  nav.appendChild(back);
  nav.appendChild(next);
  wrap.appendChild(nav);

  return wrap;
}

// ステップ2：これなら動けそう？分岐
function renderReadyStep(t) {
  const wrap = document.createElement('div');
  wrap.className = 'ready-check';

  const q = document.createElement('div');
  q.className = 'ready-q';
  q.textContent = 'ここまで分けてみて、どんな感じ？';
  wrap.appendChild(q);

  const opts = document.createElement('div');
  opts.className = 'ready-options';

  // ① 動けそう → ほめるへ
  const go = document.createElement('button');
  go.className = 'ready-btn go';
  go.innerHTML = `<span class="rb-emoji">😊</span><span class="rb-text">これなら動けそう！<br><span class="rb-sub">やってみる・できたらほめてもらう</span></span>`;
  go.onclick = () => { t.step = 3; saveState(); render(); };
  opts.appendChild(go);

  // ② もっと小さく
  const smaller = document.createElement('button');
  smaller.className = 'ready-btn smaller';
  smaller.innerHTML = `<span class="rb-emoji">🔍</span><span class="rb-text">まだ重い…もっと小さく分ける<br><span class="rb-sub">小分けにもどってさらに細かく</span></span>`;
  smaller.onclick = () => { t.step = 1; saveState(); render(); showToast('もっと小さく、で大丈夫🌱'); };
  opts.appendChild(smaller);

  // ③ 理由を考えなおす
  const rethink = document.createElement('button');
  rethink.className = 'ready-btn rethink';
  rethink.innerHTML = `<span class="rb-emoji">💭</span><span class="rb-text">重い理由をもう一度考える<br><span class="rb-sub">整理ステップにもどる</span></span>`;
  rethink.onclick = () => { t.step = 0; saveState(); render(); };
  opts.appendChild(rethink);

  // ④ 今日はここまで
  const stop = document.createElement('button');
  stop.className = 'ready-btn stop';
  stop.innerHTML = `<span class="rb-emoji">🌙</span><span class="rb-text">今日はここまでにする<br><span class="rb-sub">分けられただけで、もう一歩前進です</span></span>`;
  stop.onclick = () => {
    t.resting = true;
    t.open = false;
    saveState();
    render();
    showToast('🌙 ここまでできた自分に、はなまるを');
  };
  opts.appendChild(stop);

  wrap.appendChild(opts);

  const nav = document.createElement('div');
  nav.className = 'assist-nav';
  const back = document.createElement('button');
  back.className = 'btn-ghost';
  back.textContent = '← もどる';
  back.onclick = () => { t.step = 1; saveState(); render(); };
  nav.appendChild(back);
  nav.appendChild(document.createElement('span'));
  wrap.appendChild(nav);

  return wrap;
}

// ゲージ
function renderGauge(t) {
  const wrap = document.createElement('div');

  if (!t.gauge || !t.gauge.total) {
    const q = document.createElement('div');
    q.className = 'assist-q';
    q.textContent = 'どれくらいを目標にしますか？';
    wrap.appendChild(q);
    const hint = document.createElement('div');
    hint.className = 'assist-hint';
    hint.textContent = '「単位」を選んでから、数を入れてください。「分」を選ぶと時間を計るタイマーになります。';
    wrap.appendChild(hint);

    // 単位を先に選ぶ
    const unitLabel = document.createElement('div');
    unitLabel.className = 'gauge-field-label';
    unitLabel.textContent = '① 何で数える？';
    wrap.appendChild(unitLabel);

    const unit = document.createElement('select');
    unit.className = 'gauge-unit-select';
    unit.id = 'gauge-unit';
    unit.style.width = '100%';
    unit.style.marginBottom = '12px';
    [
      { v: '分', t: '⏱️ 分（タイマーになります）' },
      { v: 'ページ', t: '📖 ページ' },
      { v: '回', t: '🔁 回' },
      { v: '個', t: '🔢 個' },
      { v: 'ステップ', t: '👣 ステップ' }
    ].forEach(o => {
      const op = document.createElement('option');
      op.value = o.v; op.textContent = o.t;
      unit.appendChild(op);
    });
    wrap.appendChild(unit);

    // 数を入れる
    const numLabel = document.createElement('div');
    numLabel.className = 'gauge-field-label';
    wrap.appendChild(numLabel);

    // 単位に応じた小さな例
    const EXAMPLES = { '分': '例：3分', 'ページ': '例：2ページ', '回': '例：1回', '個': '例：1個', 'ステップ': '例：1ステップ' };
    const updateNumLabel = () => {
      numLabel.textContent = `② いくつを目標にする？（${EXAMPLES[unit.value] || ''}）`;
    };
    updateNumLabel();
    unit.onchange = updateNumLabel;

    const setup = document.createElement('div');
    setup.className = 'gauge-setup';
    const num = document.createElement('input');
    num.type = 'number';
    num.className = 'gauge-input';
    num.id = 'gauge-total';
    num.placeholder = '';
    num.min = '1';
    num.style.width = '90px';
    const set = document.createElement('button');
    set.className = 'btn-primary';
    set.textContent = '決定';
    set.onclick = () => {
      const total = parseInt(document.getElementById('gauge-total').value);
      if (!total || total < 1) { showToast('数を入れてください'); return; }
      t.gauge = { total, current: 0, unit: document.getElementById('gauge-unit').value };
      saveState(); render();
    };
    setup.appendChild(num);
    setup.appendChild(set);
    wrap.appendChild(setup);
    return wrap;
  }

  const g = t.gauge;

  // 単位が「分」ならタイマー、それ以外はゲージ（＋ボタン記録）
  if (g.unit === '分') {
    return renderTimer(t);
  }

  const pct = Math.min(100, Math.round(g.current / g.total * 100));

  const disp = document.createElement('div');
  disp.className = 'gauge-display';

  // 進め方の説明
  const guide = document.createElement('div');
  guide.className = 'assist-hint';
  guide.style.textAlign = 'center';
  guide.textContent = `進んだら下のボタンで記録しましょう（目標：${g.total}${g.unit}）`;
  disp.appendChild(guide);

  const barWrap = document.createElement('div');
  barWrap.className = 'gauge-bar-wrap';
  const fill = document.createElement('div');
  fill.className = 'gauge-bar-fill';
  fill.style.width = pct + '%';
  barWrap.appendChild(fill);
  disp.appendChild(barWrap);
  const label = document.createElement('div');
  label.className = 'gauge-label';
  label.textContent = `${g.current} / ${g.total} ${g.unit}　(${pct}%)`;
  disp.appendChild(label);
  wrap.appendChild(disp);

  // 「〜を追加」の見出し
  const addLabel = document.createElement('div');
  addLabel.className = 'gauge-add-label';
  addLabel.textContent = `進んだ${g.unit}を足す`;
  wrap.appendChild(addLabel);

  // 目標の大きさに合わせてボタンを出し分ける
  let stepOptions;
  if (g.total <= 5)       stepOptions = [1];
  else if (g.total <= 20) stepOptions = [1, 5];
  else                    stepOptions = [1, 5, 10];

  const controls = document.createElement('div');
  controls.className = 'gauge-controls';
  stepOptions.forEach(step => {
    const btn = document.createElement('button');
    btn.className = 'gauge-step-btn';
    btn.textContent = `＋${step}${g.unit}`;
    btn.onclick = () => {
      g.current = Math.min(g.total, g.current + step);
      saveState(); render();
      if (g.current >= g.total) showToast('🎉 目標達成！すごい！');
    };
    controls.appendChild(btn);
  });
  const minus = document.createElement('button');
  minus.className = 'gauge-step-btn minus';
  minus.textContent = `1${g.unit}もどす`;
  minus.onclick = () => { g.current = Math.max(0, g.current - 1); saveState(); render(); };
  controls.appendChild(minus);
  wrap.appendChild(controls);

  // 設定しなおす
  const redo = document.createElement('div');
  redo.style.textAlign = 'center';
  redo.style.marginTop = '12px';
  const redoBtn = document.createElement('button');
  redoBtn.className = 'btn-ghost';
  redoBtn.style.fontSize = '12px';
  redoBtn.textContent = '🔧 数や単位を設定しなおす';
  redoBtn.onclick = () => { t.gauge = null; saveState(); render(); };
  redo.appendChild(redoBtn);
  wrap.appendChild(redo);

  return wrap;
}

// ── タイマー（分のとき） ──
// g に { total(分), remain(秒), running, finished, sound } を持たせる
function renderTimer(t) {
  const g = t.gauge;
  if (g.remain === undefined) g.remain = g.total * 60;
  if (g.sound === undefined) g.sound = true;

  const wrap = document.createElement('div');
  const disp = document.createElement('div');
  disp.className = 'timer-display';

  // リング
  const R = 76, C = 2 * Math.PI * R;
  const totalSec = g.total * 60;
  const ratio = Math.max(0, g.remain / totalSec);
  const offset = C * (1 - ratio);

  const ringWrap = document.createElement('div');
  ringWrap.className = 'timer-ring-wrap';
  ringWrap.innerHTML = `
    <svg class="timer-ring" width="180" height="180" viewBox="0 0 180 180">
      <circle class="timer-ring-bg" cx="90" cy="90" r="${R}"></circle>
      <circle class="timer-ring-fg" cx="90" cy="90" r="${R}"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}"></circle>
    </svg>
    <div class="timer-time">${fmtTime(g.remain)}</div>
  `;
  disp.appendChild(ringWrap);

  const totalLabel = document.createElement('div');
  totalLabel.className = 'timer-total-label';
  totalLabel.textContent = `目標：${g.total}分`;
  disp.appendChild(totalLabel);
  wrap.appendChild(disp);

  // 完了メッセージ
  if (g.finished) {
    const done = document.createElement('div');
    done.className = 'timer-done-msg';
    done.textContent = '🎉 おつかれさま！よくがんばりました';
    wrap.appendChild(done);
  }

  // 操作ボタン
  const controls = document.createElement('div');
  controls.className = 'timer-controls';

  if (!g.running && !g.finished) {
    const startBtn = document.createElement('button');
    startBtn.className = 'timer-btn start';
    startBtn.textContent = g.remain < totalSec ? '▶ つづける' : '▶ はじめる';
    startBtn.onclick = () => startTimer(t);
    controls.appendChild(startBtn);
  }
  if (g.running) {
    const pauseBtn = document.createElement('button');
    pauseBtn.className = 'timer-btn pause';
    pauseBtn.textContent = '⏸ ちょっと休む';
    pauseBtn.onclick = () => pauseTimer(t);
    controls.appendChild(pauseBtn);
  }
  if (g.remain < totalSec || g.finished) {
    const resetBtn = document.createElement('button');
    resetBtn.className = 'timer-btn reset';
    resetBtn.textContent = '↺ 最初から';
    resetBtn.onclick = () => resetTimer(t);
    controls.appendChild(resetBtn);
  }
  wrap.appendChild(controls);

  // 設定しなおす（分数・単位を変える）
  if (!g.running) {
    const redo = document.createElement('div');
    redo.style.textAlign = 'center';
    redo.style.marginTop = '10px';
    const redoBtn = document.createElement('button');
    redoBtn.className = 'btn-ghost';
    redoBtn.style.fontSize = '12px';
    redoBtn.textContent = '🔧 時間や単位を設定しなおす';
    redoBtn.onclick = () => {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      t.gauge = null;
      saveState();
      render();
    };
    redo.appendChild(redoBtn);
    wrap.appendChild(redo);
  }

  // 音オンオフ
  const soundToggle = document.createElement('div');
  soundToggle.style.textAlign = 'center';
  soundToggle.style.marginTop = '10px';
  const toggle = document.createElement('span');
  toggle.className = 'timer-sound-toggle';
  toggle.innerHTML = g.sound ? '🔔 音でお知らせ：オン' : '🔕 音でお知らせ：オフ';
  toggle.onclick = () => { g.sound = !g.sound; saveState(); render(); };
  soundToggle.appendChild(toggle);
  wrap.appendChild(soundToggle);

  return wrap;
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

// タイマー制御（1つだけ動く想定）
let timerInterval = null;
let activeTimerTaskId = null;

function startTimer(t) {
  // 他のタイマーが動いていたら止める
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  t.gauge.running = true;
  t.gauge.finished = false;
  activeTimerTaskId = t.id;
  saveState();
  render();
  timerInterval = setInterval(() => {
    const task = state.tasks.find(x => x.id === activeTimerTaskId);
    if (!task || !task.gauge || !task.gauge.running) {
      clearInterval(timerInterval); timerInterval = null; return;
    }
    task.gauge.remain -= 1;
    if (task.gauge.remain <= 0) {
      task.gauge.remain = 0;
      task.gauge.running = false;
      task.gauge.finished = true;
      clearInterval(timerInterval); timerInterval = null;
      saveState();
      render();
      if (task.gauge.sound) playChime();
      showToast('🎉 おつかれさま！時間になりました');
    } else {
      saveState();
      updateTimerDisplay(task);
    }
  }, 1000);
}

function pauseTimer(t) {
  t.gauge.running = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  saveState();
  render();
}

function resetTimer(t) {
  t.gauge.running = false;
  t.gauge.finished = false;
  t.gauge.remain = t.gauge.total * 60;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  saveState();
  render();
}

// 毎秒の再描画は重いので、時間とリングだけ部分更新
function updateTimerDisplay(t) {
  const timeEl = document.querySelector('.timer-time');
  const fgEl = document.querySelector('.timer-ring-fg');
  if (!timeEl || !fgEl) return;
  timeEl.textContent = fmtTime(t.gauge.remain);
  const R = 76, C = 2 * Math.PI * R;
  const totalSec = t.gauge.total * 60;
  const ratio = Math.max(0, t.gauge.remain / totalSec);
  fgEl.setAttribute('stroke-dashoffset', C * (1 - ratio));
}

// やさしいチャイム音（Web Audio）
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99]; // ド・ミ・ソ
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.3, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
      osc.start(start);
      osc.stop(start + 0.6);
    });
  } catch(e) { /* 音が出せない環境は無視 */ }
}

// ステップ（手順を書き出す→1つ選ぶ→主役表示）
function renderSteps(t) {
  const wrap = document.createElement('div');
  const steps = t.steps || [];
  const chosen = steps.find(s => s.chosen && !s.done);

  // 書き出しフェーズ（まだ主役が選ばれていない）
  if (!chosen) {
    const q = document.createElement('div');
    q.className = 'assist-q';
    q.textContent = '思いつく手順を、書き出してみましょう';
    wrap.appendChild(q);
    const hint = document.createElement('div');
    hint.className = 'assist-hint';
    hint.textContent = 'いくつでも書けます。3〜5個くらい、思いつくままにどうぞ。順番も完璧さも気にしないで大丈夫です🌱（あとで並べ替えできます）';
    wrap.appendChild(hint);

    const form = document.createElement('div');
    form.className = 'step-add-form';
    const input = document.createElement('input');
    input.className = 'task-input';
    input.id = `step-input-${t.id}`;
    input.placeholder = '例：机の上だけ片付ける';
    input.onkeydown = (e) => { if (e.key === 'Enter') addStep(t.id); };
    const btn = document.createElement('button');
    btn.className = 'btn-primary';
    btn.textContent = '＋';
    btn.onclick = () => addStep(t.id);
    form.appendChild(input);
    form.appendChild(btn);
    wrap.appendChild(form);

    // 未完了の手順を一覧（選べる）
    const pending = steps.filter(s => !s.done);
    if (pending.length > 0) {
      const chooseLabel = document.createElement('div');
      chooseLabel.className = 'gauge-field-label';
      chooseLabel.style.marginTop = '14px';
      chooseLabel.textContent = 'やりやすい順に並べて、今回はどれをやるか選びましょう';
      wrap.appendChild(chooseLabel);
      const tapHint = document.createElement('div');
      tapHint.className = 'assist-hint';
      tapHint.textContent = '↑↓で並べ替え。終わったらタップしましょう。🌸が咲きます。';
      wrap.appendChild(tapHint);
    }

    const list = document.createElement('div');
    list.className = 'step-list';
    pending.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = 'step-item';

      // 並べ替えボタン
      const moveBox = document.createElement('div');
      moveBox.className = 'step-move';
      const up = document.createElement('button');
      up.className = 'step-move-btn';
      up.innerHTML = '▲';
      up.title = '上へ';
      up.disabled = idx === 0;
      up.onclick = (e) => { e.stopPropagation(); moveStep(t.id, s.id, -1); };
      const down = document.createElement('button');
      down.className = 'step-move-btn';
      down.innerHTML = '▼';
      down.title = '下へ';
      down.disabled = idx === pending.length - 1;
      down.onclick = (e) => { e.stopPropagation(); moveStep(t.id, s.id, 1); };
      moveBox.appendChild(up);
      moveBox.appendChild(down);
      item.appendChild(moveBox);

      const text = document.createElement('div');
      text.className = 'step-text';
      text.textContent = s.text;
      const choose = document.createElement('button');
      choose.className = 'btn-primary';
      choose.style.fontSize = '12px';
      choose.style.padding = '6px 12px';
      choose.textContent = 'これにする';
      choose.onclick = (e) => { e.stopPropagation(); chooseStep(t.id, s.id); };
      const del = document.createElement('button');
      del.className = 'step-del';
      del.innerHTML = '✕';
      del.onclick = (e) => { e.stopPropagation(); deleteStep(t.id, s.id); };
      item.appendChild(text);
      item.appendChild(choose);
      item.appendChild(del);
      list.appendChild(item);
    });
    wrap.appendChild(list);

    // 完了済みがあれば下に表示
    appendDoneSteps(wrap, t, steps);
    return wrap;
  }

  // 主役フェーズ（1つ選ばれている）
  const q = document.createElement('div');
  q.className = 'assist-q';
  q.style.textAlign = 'center';
  q.textContent = 'まずは、これだけ！';
  wrap.appendChild(q);

  const hero = document.createElement('div');
  hero.className = 'step-hero';
  hero.innerHTML = `<span class="step-hero-emoji">🌟</span><div class="step-hero-text">${escapeHtml(chosen.text)}</div>`;
  wrap.appendChild(hero);

  const heroActions = document.createElement('div');
  heroActions.className = 'timer-controls';
  const doneBtn = document.createElement('button');
  doneBtn.className = 'timer-btn start';
  doneBtn.textContent = '🌸 できた！';
  doneBtn.onclick = () => {
    chosen.done = true;
    chosen.chosen = false;
    saveState(); render();
    const rest = (t.steps || []).filter(s => !s.done);
    showToast(rest.length > 0 ? '🌸 ひとつできた！えらい！' : '🎉 ぜんぶできました！');
  };
  const backChoose = document.createElement('button');
  backChoose.className = 'timer-btn reset';
  backChoose.textContent = '↩ 選びなおす';
  backChoose.onclick = () => { chosen.chosen = false; saveState(); render(); };
  heroActions.appendChild(doneBtn);
  heroActions.appendChild(backChoose);
  wrap.appendChild(heroActions);

  // このあとやること（残り）
  const rest = steps.filter(s => !s.done && !s.chosen);
  if (rest.length > 0) {
    const restLabel = document.createElement('div');
    restLabel.className = 'gauge-field-label';
    restLabel.style.marginTop = '18px';
    restLabel.textContent = 'このあとやること';
    wrap.appendChild(restLabel);
    const restList = document.createElement('div');
    restList.className = 'step-list';
    rest.forEach(s => {
      const item = document.createElement('div');
      item.className = 'step-item step-rest';
      const text = document.createElement('div');
      text.className = 'step-text';
      text.textContent = s.text;
      item.appendChild(text);
      restList.appendChild(item);
    });
    wrap.appendChild(restList);
  }

  appendDoneSteps(wrap, t, steps);
  return wrap;
}

// 完了済みの手順を下に表示
function appendDoneSteps(wrap, t, steps) {
  const done = steps.filter(s => s.done);
  if (done.length === 0) return;
  const doneLabel = document.createElement('div');
  doneLabel.className = 'gauge-field-label';
  doneLabel.style.marginTop = '18px';
  doneLabel.textContent = `できたこと（${done.length}）`;
  wrap.appendChild(doneLabel);
  const list = document.createElement('div');
  list.className = 'step-list';
  done.forEach(s => {
    const item = document.createElement('div');
    item.className = 'step-item done';
    const dot = document.createElement('div');
    dot.className = 'step-dot';
    dot.textContent = '🌸';
    const text = document.createElement('div');
    text.className = 'step-text';
    text.textContent = s.text;
    const undo = document.createElement('button');
    undo.className = 'step-del';
    undo.innerHTML = '↩';
    undo.title = 'もどす';
    undo.onclick = (e) => { e.stopPropagation(); s.done = false; saveState(); render(); };
    item.appendChild(dot);
    item.appendChild(text);
    item.appendChild(undo);
    list.appendChild(item);
  });
  wrap.appendChild(list);
}

function chooseStep(tid, sid) {
  const t = state.tasks.find(t => t.id === tid);
  (t.steps || []).forEach(s => { s.chosen = (s.id === sid); });
  saveState();
  render();
}

function moveStep(tid, sid, dir) {
  const t = state.tasks.find(t => t.id === tid);
  if (!t || !t.steps) return;
  // 未完了の手順だけで並べ替え
  const pending = t.steps.filter(s => !s.done);
  const idx = pending.findIndex(s => s.id === sid);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= pending.length) return;
  // 全体配列の中での位置を取得して入れ替え
  const fromId = pending[idx].id;
  const toId = pending[newIdx].id;
  const fromIdx = t.steps.findIndex(s => s.id === fromId);
  const toIdx = t.steps.findIndex(s => s.id === toId);
  const [item] = t.steps.splice(fromIdx, 1);
  t.steps.splice(toIdx, 0, item);
  saveState();
  render();
}

// ステップ2：ほめる
function renderPraiseStep(t) {
  const wrap = document.createElement('div');
  wrap.className = 'praise-area';

  const title = document.createElement('div');
  title.className = 'praise-title';
  title.textContent = 'よくがんばりました！';
  wrap.appendChild(title);
  const sub = document.createElement('div');
  sub.className = 'praise-sub';
  sub.textContent = '今日の自分に、言葉をかけてあげましょう';
  wrap.appendChild(sub);

  const opts = document.createElement('div');
  opts.className = 'praise-options';
  PRAISE_WORDS.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'praise-btn';
    btn.textContent = w;
    btn.onclick = () => { t.praise = w; t.done = true; saveState(); render(); showToast('🎉 おつかれさまでした！'); };
    opts.appendChild(btn);
  });
  wrap.appendChild(opts);

  const custom = document.createElement('input');
  custom.className = 'praise-custom';
  custom.id = `praise-custom-${t.id}`;
  custom.placeholder = '✏️ 自分の言葉でほめる…（入力してEnter）';
  custom.onkeydown = (e) => {
    if (e.key === 'Enter' && custom.value.trim()) {
      t.praise = custom.value.trim(); t.done = true; saveState(); render(); showToast('🎉 おつかれさまでした！');
    }
  };
  wrap.appendChild(custom);

  const nav = document.createElement('div');
  nav.className = 'assist-nav';
  const back = document.createElement('button');
  back.className = 'btn-ghost';
  back.textContent = '← もどる';
  back.onclick = () => { t.step = 2; saveState(); render(); };
  nav.appendChild(back);
  nav.appendChild(document.createElement('span'));
  wrap.appendChild(nav);

  return wrap;
}

// 完了画面
function renderCelebrate(t) {
  const wrap = document.createElement('div');
  wrap.className = 'celebrate';
  wrap.innerHTML = `
    <span class="celebrate-emoji">🎉</span>
    <div class="celebrate-msg">「${escapeHtml(t.text)}」<br>に向き合えました！</div>
    <div class="celebrate-praise">${escapeHtml(t.praise)}</div>
  `;
  const again = document.createElement('button');
  again.className = 'btn-ghost';
  again.textContent = 'もう一度ふりかえる';
  again.onclick = () => { t.done = false; t.step = 0; saveState(); render(); };
  wrap.appendChild(again);
  return wrap;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ──────────────────────────────────────────────
// 操作
// ──────────────────────────────────────────────
let pendingTaskText = null;
let pendingMood = null;

function addTask() {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  pendingTaskText = text;
  pendingMood = null;
  input.value = '';
  showMoodPicker();
}

function showMoodPicker() {
  const main = document.getElementById('main-content');
  const old = document.getElementById('mood-picker');
  if (old) old.remove();
  const card = document.createElement('div');
  card.className = 'card card-pad';
  card.id = 'mood-picker';
  const q = document.createElement('div');
  q.className = 'assist-q';
  q.style.textAlign = 'center';
  q.textContent = `「${pendingTaskText}」、今どんな気持ち？`;
  card.appendChild(q);
  const sel = document.createElement('div');
  sel.className = 'mood-select';
  Object.keys(MOOD).forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'mood-btn';
    btn.innerHTML = `<span class="mood-emoji">${MOOD[k].emoji}</span><span class="mood-label">${MOOD[k].label}</span>`;
    btn.onclick = () => { pendingMood = k; showEnergyPicker(); };
    sel.appendChild(btn);
  });
  card.appendChild(sel);
  main.insertBefore(card, main.children[1]);
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showEnergyPicker() {
  const card = document.getElementById('mood-picker');
  card.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'assist-q';
  q.style.textAlign = 'center';
  q.textContent = '今の元気度は、どれくらい？';
  card.appendChild(q);
  const hint = document.createElement('div');
  hint.className = 'assist-hint';
  hint.style.textAlign = 'center';
  hint.textContent = '正直な気持ちで大丈夫。それも大切な目安です。';
  card.appendChild(hint);
  const sel = document.createElement('div');
  sel.className = 'mood-select';
  Object.keys(ENERGY).forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'mood-btn';
    btn.innerHTML = `<span class="mood-emoji">${ENERGY[k].emoji}</span><span class="mood-label">${ENERGY[k].label}</span>`;
    btn.onclick = () => {
      if (k === 'tired') showRestSuggestion();
      else confirmAddTask(pendingMood, k);
    };
    sel.appendChild(btn);
  });
  card.appendChild(sel);
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showRestSuggestion() {
  const card = document.getElementById('mood-picker');
  card.innerHTML = '';
  const rest = document.createElement('div');
  rest.className = 'rest-suggest';
  rest.innerHTML = `
    <span class="rest-emoji">🌙</span>
    <div class="rest-msg">今日はおやすみする勇気も、<br>自分を大切にすることです。</div>
    <div class="rest-sub">無理しなくて大丈夫。<br>「${escapeHtml(pendingTaskText)}」はとっておいて、<br>また元気なときに会いましょう。</div>
  `;
  const actions = document.createElement('div');
  actions.className = 'rest-actions';
  const restBtn = document.createElement('button');
  restBtn.className = 'btn-primary';
  restBtn.style.background = 'var(--soft-blue)';
  restBtn.style.color = 'var(--text)';
  restBtn.textContent = '🛏️ 今日は休む（とっておく）';
  restBtn.onclick = () => confirmAddTask(pendingMood, 'tired', true);
  const goBtn = document.createElement('button');
  goBtn.className = 'btn-ghost';
  goBtn.textContent = 'それでも少しだけやってみる';
  goBtn.onclick = () => confirmAddTask(pendingMood, 'tired', false);
  actions.appendChild(restBtn);
  actions.appendChild(goBtn);
  rest.appendChild(actions);
  card.appendChild(rest);
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function confirmAddTask(mood, energy, resting) {
  const old = document.getElementById('mood-picker');
  if (old) old.remove();
  state.tasks.unshift({
    id: uid(),
    text: pendingTaskText,
    mood,
    energy,
    resting: !!resting,
    open: !resting,   // 休む選択なら閉じた状態で置いておく
    step: 0,
    think: { heavy: '', reward: '', block: '', tiny: '', help: '' },
    breakType: null,
    gauge: null,
    steps: [],
    praise: '',
    done: false
  });
  pendingTaskText = null;
  pendingMood = null;
  saveState();
  render();
  if (resting) showToast('🌙 ゆっくり休んでくださいね');
}

function deleteTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  render();
}

function addStep(tid) {
  const input = document.getElementById(`step-input-${tid}`);
  const text = input.value.trim();
  if (!text) return;
  const t = state.tasks.find(t => t.id === tid);
  if (!t.steps) t.steps = [];
  t.steps.push({ id: uid(), text, done: false, chosen: false });
  saveState();
  render();
  const ni = document.getElementById(`step-input-${tid}`);
  if (ni) ni.focus();
}

function deleteStep(tid, sid) {
  const t = state.tasks.find(t => t.id === tid);
  t.steps = t.steps.filter(s => s.id !== sid);
  saveState();
  render();
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ──────────────────────────────────────────────
render();
</script>
